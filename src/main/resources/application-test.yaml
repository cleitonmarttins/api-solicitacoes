spring:

  datasource:
    url: jdbc:h2:mem:bd-solicitacoes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  mongodb:
    repositories:
      enabled: false

  rabbitmq:
    host: localhost
    port: 5672
    username: coti
    password: coti
    virtual-host: /